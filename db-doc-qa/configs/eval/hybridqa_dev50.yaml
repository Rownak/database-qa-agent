name: hybridqa_dev50
agent:
  intent_enabled: false         # the classifier prompt is about shipments
  model:
    agent: gemini-3.5-flash-lite
    temperature: 0.0
  retrieval:
    mode: hybrid
dataset:
  path: ../benchmark/hybridqa_prepared/dev_s50/dataset.yaml
eval:
  mode: agent
  metrics: [exact_match, squad_f1, answer_contains, coverage, object_f1]
  predictions: true
