name: lakequest_bank_sample
agent:
  profile: lakequest            # LAKE_INSTRUCTION (shipments is the default)
  intent_enabled: true          # the classifier labels each question; LAKE_INSTRUCTION uses the label
  intent_prompt_file: configs/prompts/intent_lakequest.md   # bank-domain classifier prompt
  model:
    agent: gemini-3.5-flash-lite
    temperature: 0.0
  retrieval:
    mode: hybrid
dataset:
  path: ../benchmark/lakequest_prepared/bank_sample/dataset.yaml
eval:
  mode: agent
  metrics: [tool_sequence_match, section_recall, answer_contains, citation_precision,
            answer_f1, object_f1, coverage]
  predictions: true
